name: Refresh link previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: link-previews
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run previews
      - name: Commit refreshed images
        run: |
          git add assets/previews/*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh link preview screenshots"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger a branch-based Pages build.
      # Request one explicitly, including when a previous attempt failed here.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
